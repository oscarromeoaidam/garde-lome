name: Mise à jour des gardes

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garde-lome
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r robot/requirements.txt

      - name: Lancer le robot
        id: robot
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python robot/robot.py

      - name: Enregistrer le résultat
        run: |
          git config user.name "robot-garde"
          git config user.email "robot-garde@users.noreply.github.com"
          git add site/data/garde.json
          git diff --cached --quiet || { git commit -m "Mise à jour de la liste de garde"; git pull --rebase; git push; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploiement

      - name: Signaler un problème
        if: steps.robot.outcome == 'failure'
        run: |
          echo "Le robot demande une vérification. Lisez l'étape Lancer le robot."
          exit 1
