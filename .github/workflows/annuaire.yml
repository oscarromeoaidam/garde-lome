name: Importer l'annuaire

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python robot/importer_annuaire.py
      - name: Enregistrer l'annuaire
        run: |
          git config user.name "robot-garde"
          git config user.email "robot-garde@users.noreply.github.com"
          git add data/annuaire.json
          git diff --cached --quiet || { git commit -m "Mise à jour de l'annuaire"; git push; }
